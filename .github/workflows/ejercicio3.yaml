name: Ejercicio 3 - Matrix Strategy Python

on:
  workflow_dispatch:

jobs:
  test:
    name: "Test en Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Mostrar versión de Python
        run: python --version

      - name: Test simple
        run: python -c "import sys; print('Ejecutando en', sys.version)"